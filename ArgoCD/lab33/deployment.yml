apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx2
  namespace: ivolve
  labels:
    app: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: mohamedelrefy20/lab33:12
        ports:
        - containerPort: 80
